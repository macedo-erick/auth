# Bingyx login theme.
#
# Inherits keycloak.v2 so screens we do not template (OTP, update-password, terms,
# page-expired) keep working; login/register/reset are hand-written to match the app's
# join screen — pine night sky, gold star, cream card, red button — and template.ftl is
# the shell all of them share.
#
# Only the organiser ever lands here. Players join a game through its invitation link and
# never see Keycloak, which is what the login page's subtitle tells anyone who wanders in.
#
# `styles` is a full override, so the parent's css/styles.css must be listed again
# before ours. `stylesCommon` stays inherited so PatternFly still loads for the
# screens we did not template.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/bingyx.css

locales=pt-BR,en
