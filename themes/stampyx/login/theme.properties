# Stampyx login theme.
#
# Inherits keycloak.v2 so screens we do not template (OTP, update-password, terms,
# page-expired) keep working; login/register/reset are fully hand-written for the
# lean single-card layout, and template.ftl is the shell all of them share.
#
# `styles` is a full override, so the parent's css/styles.css must be listed again
# before ours. `stylesCommon` stays inherited so PatternFly still loads for the
# screens we did not template.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/stampyx.css

# Stampyx is the mail provider, so the address a user picks is a local part and this
# is the only place the domain is written. Signup and sign-in both read it back.
stampyxMailDomain=stampyx.com
